<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language Code Playground | Learn IT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        body {
            background: #090d2a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background: rgba(11, 11, 107, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-badge {
            width: 36px;
            height: 36px;
            background: #3b82f6;
            color: #ffffff;
            font-weight: 800;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .logo-title {
            font-weight: 800;
            font-size: 1.15rem;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
        }

        .playground-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .template-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .template-select option {
            background: #0f172a;
            color: #ffffff;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-run {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-run:hover {
            background: #059669;
        }

        /* Main Workspace Split View */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 65px);
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }

        /* Editor Section */
        .editor-section {
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
        }

        .editor-tabs {
            display: flex;
            background: #090d2a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #ffffff;
            background: #0f172a;
            border-bottom-color: #3b82f6;
        }

        .editor-container {
            flex: 1;
            position: relative;
        }

        .code-textarea {
            width: 100%;
            height: 100%;
            background: #0f172a;
            color: #f8fafc;
            border: none;
            padding: 20px;
            font-family: 'Consolas', 'Fira Code', Monaco, monospace;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            resize: none;
            display: none;
        }

        .code-textarea.active {
            display: block;
        }

        /* Output & Console Section */
        .preview-section {
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        .preview-header {
            background: #1e293b;
            color: #f8fafc;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #ffffff;
        }

        /* Console Log Window */
        .console-window {
            height: 140px;
            background: #090d2a;
            color: #a7f3d0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-family: monospace;
            font-size: 12px;
            padding: 10px 14px;
            overflow-y: auto;
        }

        .console-header {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
        }

        .console-line {
            margin-bottom: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-group">
            <div class="logo-badge">IT</div>
            <div class="logo-title">Learn IT Playground</div>
        </a>

        <div class="playground-controls">
            <select class="template-select" onchange="loadTemplate(this.value)">
                <option value="default">📋 Starter Template</option>
                <option value="card">🎨 Animated 3D Card</option>
                <option value="counter">⚡ Interactive Counter App</option>
                <option value="quiz">🎯 Dynamic Quiz Widget</option>
            </select>

            <button class="btn-action btn-run" onclick="runCode()">
                ▶ Run Code
            </button>

            <button class="btn-action" onclick="copyCombinedCode()">
                📋 Copy Code
            </button>

            <span id="autoSaveIndicator" style="font-size: 0.8rem; background: rgba(16,185,129,0.2); color: #6ee7b7; padding: 4px 10px; border-radius: 999px; font-weight: 700;">
                Saved ✓
            </span>

            <a href="dashboard.html" class="btn-action" style="text-decoration: none; background: #3b82f6;">
                📊 Dashboard
            </a>
        </div>
    </header>

    <main class="workspace">
        <!-- CODE EDITORS -->
        <div class="editor-section">
            <div class="editor-tabs">
                <button id="tabHtml" class="tab-btn active" onclick="switchEditorTab('html')">
                    <span style="color: #ef4444;">&lt;/&gt;</span> index.html
                </button>
                <button id="tabCss" class="tab-btn" onclick="switchEditorTab('css')">
                    <span style="color: #3b82f6;">#</span> style.css
                </button>
                <button id="tabJs" class="tab-btn" onclick="switchEditorTab('js')">
                    <span style="color: #facc15;">JS</span> script.js
                </button>
            </div>

            <div class="editor-container">
                <textarea id="htmlEditor" class="code-textarea active" spellcheck="false" placeholder="Write HTML here..."></textarea>
                <textarea id="cssEditor" class="code-textarea" spellcheck="false" placeholder="Write CSS here..."></textarea>
                <textarea id="jsEditor" class="code-textarea" spellcheck="false" placeholder="Write JavaScript here..."></textarea>
            </div>
        </div>

        <!-- PREVIEW & CONSOLE -->
        <div class="preview-section">
            <div class="preview-header">
                <span>🖥️ Live Application Preview</span>
                <span id="previewStatusText" style="color: #10b981;">Active</span>
            </div>

            <iframe id="previewIframe"></iframe>

            <div class="console-window">
                <div class="console-header">
                    <span>📟 JavaScript Virtual Console</span>
                    <button onclick="clearConsole()" style="background: transparent; border: none; color: #f87171; cursor: pointer; font-size: 11px;">Clear</button>
                </div>
                <div id="consoleLogs">
                    <div class="console-line" style="color: #94a3b8;">Ready. Output from console.log() will appear here.</div>
                </div>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        let currentTab = 'html';
        let saveTimeout = null;

        const templates = {
            card: {
                html: `<div class="card">
  <div class="badge">PRO COURSE</div>
  <h2>Full-Stack Web Dev</h2>
  <p>Learn HTML, CSS, JavaScript, and Backend APIs with real hands-on projects.</p>
  <button onclick="showAlert()">Enroll Today →</button>
</div>`,
                css: `body {
  background: linear-gradient(135deg, #0b0b6b 0%, #1e293b 100%);
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: system-ui, sans-serif;
}

.card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 35px;
  border-radius: 20px;
  color: #fff;
  max-width: 320px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.badge {
  background: #facc15;
  color: #0f172a;
  display: inline-block;
  padding: 4px 12px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 11px;
}

h2 { margin: 15px 0 10px; color: #38bdf8; }
p { color: #cbd5e1; font-size: 14px; line-height: 1.6; }

button {
  background: #3b82f6;
  color: #fff;
  border: none;
  padding: 12px 24px;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 15px;
}`,
                js: `function showAlert() {
  alert('🎉 Thank you for enrolling in Full-Stack Web Dev!');
  console.log('User clicked enrollment button at ' + new Date().toLocaleTimeString());
}`
            },
            counter: {
                html: `<div class="counter-box">
  <h1>Counter App</h1>
  <div id="countDisplay">0</div>
  <div class="btns">
    <button onclick="decrement()">-</button>
    <button onclick="reset()">Reset</button>
    <button onclick="increment()">+</button>
  </div>
</div>`,
                css: `body {
  background: #0f172a;
  color: #fff;
  display: grid;
  place-items: center;
  min-height: 100vh;
  font-family: sans-serif;
}

.counter-box {
  background: #1e293b;
  padding: 30px 40px;
  border-radius: 20px;
  border: 2px solid #3b82f6;
  text-align: center;
}

#countDisplay {
  font-size: 4rem;
  font-weight: 800;
  color: #facc15;
  margin: 20px 0;
}

.btns { display: flex; gap: 10px; }

button {
  background: #3b82f6;
  color: #fff;
  border: none;
  padding: 10px 20px;
  font-size: 1.1rem;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
}`,
                js: `let count = 0;
function updateDisplay() {
  document.getElementById('countDisplay').textContent = count;
  console.log('Current count value: ' + count);
}
function increment() { count++; updateDisplay(); }
function decrement() { count--; updateDisplay(); }
function reset() { count = 0; updateDisplay(); }`
            }
        };

        function switchEditorTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.code-textarea').forEach(area => area.classList.remove('active'));

            if (tab === 'html') {
                document.getElementById('tabHtml').classList.add('active');
                document.getElementById('htmlEditor').classList.add('active');
            } else if (tab === 'css') {
                document.getElementById('tabCss').classList.add('active');
                document.getElementById('cssEditor').classList.add('active');
            } else if (tab === 'js') {
                document.getElementById('tabJs').classList.add('active');
                document.getElementById('jsEditor').classList.add('active');
            }
        }

        function runCode() {
            const html = document.getElementById('htmlEditor').value;
            const css = document.getElementById('cssEditor').value;
            const js = document.getElementById('jsEditor').value;
            const iframe = document.getElementById('previewIframe');

            const consoleIntercepScript = `
                <script>
                    (function() {
                        const _log = console.log;
                        console.log = function(...args) {
                            _log.apply(console, args);
                            window.parent.postMessage({ type: 'CONSOLE_LOG', text: args.join(' ') }, '*');
                        };
                    })();
                <\/script>
            `;

            iframe.srcdoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>${css}</style>
                    ${consoleIntercepScript}
                </head>
                <body>
                    ${html}
                    <script>${js}<\/script>
                </body>
                </html>
            `;

            triggerAutoSave();
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'CONSOLE_LOG') {
                const logs = document.getElementById('consoleLogs');
                const line = document.createElement('div');
                line.className = 'console-line';
                line.textContent = `> ${e.data.text}`;
                logs.appendChild(line);
                logs.scrollTop = logs.scrollHeight;
            }
        });

        function clearConsole() {
            document.getElementById('consoleLogs').innerHTML = '<div class="console-line" style="color: #94a3b8;">Console cleared.</div>';
        }

        function triggerAutoSave() {
            const indicator = document.getElementById('autoSaveIndicator');
            if (indicator) {
                indicator.textContent = "Saving...";
                indicator.style.background = "rgba(240, 165, 0, 0.2)";
                indicator.style.color = "#facc15";
            }

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                if (window.AuthEngine) {
                    window.AuthEngine.saveUserWork({
                        htmlCode: document.getElementById('htmlEditor').value,
                        cssCode: document.getElementById('cssEditor').value,
                        jsCode: document.getElementById('jsEditor').value
                    });
                }
                if (indicator) {
                    indicator.textContent = "Saved ✓";
                    indicator.style.background = "rgba(16, 185, 129, 0.2)";
                    indicator.style.color = "#6ee7b7";
                }
            }, 600);
        }

        function loadPlaygroundState() {
            if (!window.AuthEngine) return;
            const work = window.AuthEngine.loadUserWork();

            if (work) {
                if (work.htmlCode) document.getElementById('htmlEditor').value = work.htmlCode;
                if (work.cssCode) document.getElementById('cssEditor').value = work.cssCode;
                if (work.jsCode) document.getElementById('jsEditor').value = work.jsCode;
            }

            runCode();
        }

        function loadTemplate(key) {
            if (templates[key]) {
                document.getElementById('htmlEditor').value = templates[key].html;
                document.getElementById('cssEditor').value = templates[key].css;
                document.getElementById('jsEditor').value = templates[key].js;
                runCode();
            }
        }

        function copyCombinedCode() {
            const combined = `<!-- HTML -->\n${document.getElementById('htmlEditor').value}\n\n/* CSS */\n${document.getElementById('cssEditor').value}\n\n// JS\n${document.getElementById('jsEditor').value}`;
            navigator.clipboard.writeText(combined).then(() => {
                if (window.AuthEngine) {
                    window.AuthEngine.showToast('📋 All code copied to clipboard!', 'success');
                }
            });
        }

        document.querySelectorAll('.code-textarea').forEach(textarea => {
            textarea.addEventListener('input', triggerAutoSave);
        });

        document.addEventListener('DOMContentLoaded', loadPlaygroundState);
    </script>
</body>
</html>
